name: Scheduled Ingestion

on:
  schedule:
    - cron: '0 6 * * *'  # daily, 06:00 UTC
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # FR4: one source failing must not block the others
      matrix:
        source: [cisa_kev, urlhaus, threatfox, otx]
    steps:
      - name: Trigger ingestion for ${{ matrix.source }}
        run: |
          response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
            -H "X-Ingest-Secret: ${{ secrets.INGEST_SHARED_SECRET }}" \
            "https://project-inception.onrender.com/internal/ingest/${{ matrix.source }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code: $body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::HTTP $http_code from ingest endpoint for ${{ matrix.source }}"
            exit 1
          fi

          status=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          if [ "$status" = "failed" ]; then
            echo "::error::Ingestion for ${{ matrix.source }} reported status=failed"
            exit 1
          fi
